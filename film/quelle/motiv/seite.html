  if(!a){ ut.style.opacity='0'; return; }
  if(ut.dataset.f!==a.vo){ ut.dataset.f=a.vo; ut.innerHTML=a.vo.split(' ').map(w=>`<span>${w}</span>`).join(' '); }
  const W_=[...ut.querySelectorAll('span')], f=(t-a.vo_a)/(a.vo_d*0.92);
  W_.forEach((w,k)=>w.style.opacity = (k/W_.length<=f)?'1':'.25');
  ut.style.opacity=eOut(pr(t,a.vo_a,a.vo_a+0.2)).toFixed(3);
};
window.render(0); window.bereit=true;
</script></body></html>
