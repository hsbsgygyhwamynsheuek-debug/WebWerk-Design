<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Episode</title>
<link rel="stylesheet" href="profi.css">
<style>
.szene{position:absolute;inset:0;display:none;overflow:hidden}
.rahmen{position:absolute;left:0;top:0;transform-origin:0 0}
.rahmen canvas{display:block}
#ende .gr b{color:#FF8A3D}
#titel{position:absolute;left:50px;right:50px;top:190px;text-align:center;
  font-family:"Inter Display","Inter",sans-serif;font-weight:800;font-size:72px;line-height:1.1;
  color:#fff;letter-spacing:-.025em;opacity:0;
  text-shadow:0 5px 0 rgba(0,0,0,.92),0 0 22px rgba(0,0,0,.92),0 0 60px rgba(0,0,0,.7)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><filter id="wisch" x="-20%" y="0" width="140%" height="100%">
<feGaussianBlur id="wischblur" stdDeviation="0 0"/></filter></svg>
<div id="stage">
 <div id="szenen"></div>
 <div id="staub"></div>
 <div id="vig"></div>
 <div id="titel"></div>
 <div id="ut"></div>
 <div id="ende"><div class="gr"></div><div class="kl"></div></div>
</div>
<script src="bilder.js"></script>
<script src="warp3.js"></script>
<script src="kino.js"></script>
<script>
const D = __DATA__;
const M=D.marken, BEAT=D.beat, TAKT=BEAT*4, S16=BEAT/4, DAUER=D.dauer;
window.FILM_DAUER=DAUER; window.bereit=false;
const FARBE={P:'#FFB86B',A:'#FF7A66',K:'#F1E2BE',N:'#FFE066',X:'#FFFFFF'};
const IDS=Object.keys(D.szenen);
/* Szenen aufbauen */
const box=document.getElementById('szenen');
IDS.forEach(id=>{
  const s=D.szenen[id];
  const z=(s.zahlen||[]).map((n,i)=>`<div class="z ${n.cls||''}" data-i="${i}" style="left:${n.x}px;top:${n.y}px;font-size:${n.fs}px">${n.t}</div>`).join('');
  box.insertAdjacentHTML('beforeend',`<div class="szene" id="${id}"><div class="rahmen" style="width:${s.w}px;height:${s.h}px">
    <canvas width="${s.w}" height="${s.h}" style="width:${s.w}px;height:${s.h}px"></canvas>${z}</div></div>`);
});
if(D.ende){ q('#ende .gr').innerHTML=`${D.ende.gr1}<b>${D.ende.gr2}</b>`; q('#ende .kl').textContent=D.ende.kl; }
function kamera3(cx,cy,z,W,H){
  const hw=540/z, hh=960/z;
  cx=Math.max(hw,Math.min(W-hw,cx)); cy=Math.max(hh,Math.min(H-hh,cy));
  return `translate(${(540-cx*z).toFixed(2)}px,${(960-cy*z).toFixed(2)}px) scale(${z.toFixed(4)})`;
}
staubAn(24);
const ENDE_BEAT = M.stille ?? M.ende ?? DAUER;
const KICKS=[]; if(M.drop!==undefined) for(let b=M.drop;b<ENDE_BEAT-0.01;b+=TAKT) for(const s of [0,6,10]){const k=b+s*S16; if(k<ENDE_BEAT) KICKS.push(k);}
const BL={}; ['K','P','A','N'].forEach((k,n)=>{const l=[];let z=0.8+n*0.6,s=57+n*19;
  while(z<DAUER){l.push(z);s=(s*1103515245+12345)%2147483648;z+=2.0+(s/2147483648)*2.8;} BL[k]=l;});
const blz=(k,t)=>{let m=0;for(const z of BL[k]){const d=t-z;if(d>=0&&d<0.16)m=Math.max(m,Math.sin(Math.PI*d/0.16));}return m;};
const RUHE={K:{t:3.9,p:0,amp:3.4},P:{t:3.0,p:1.7,amp:3.0},A:{t:3.5,p:3.1,amp:2.6},N:{t:4.2,p:2.2,amp:2.4}};
function aktiveRede(t){for(const r of D.reden) if(t>=r.a&&t<r.a+r.d+0.05) return r; return null;}
function env(r,t){const n=Math.min(r.env.length-1,Math.max(0,Math.floor((t-r.a)*25)));return r.env[n];}
function zustand(t,sz){
  const r=aktiveRede(t), z={}, fig=D.szenen[sz].fig||{};
  ['K','P','A','N'].forEach(k=>{const q=RUHE[k],w=2*Math.PI/q.t;
    let dy=Math.sin(w*t+q.p)*q.amp, dx=Math.sin(w*.63*t+q.p*1.7)*q.amp*1.4,
        rot=Math.sin(w*.47*t+q.p*.8)*.011, sc=Math.sin(w*t+q.p)*.0045, mund=0;
    if(r&&r.w===k&&fig[k]){const a=env(r,t);mund=a;dy-=a*(k==='K'?8:5);
      rot+=a*(k==='P'?.016:k==='A'?-.016:.009);sc+=a*.004;}
    if(k==='K'&&M.drop!==undefined){const d=t-M.drop;if(d>=0&&d<0.5)sc+=0.03*Math.exp(-d*9);}
    z[k]={dx,dy,rot,sc,mund,blinzel:blz(k,t)};});
  return z;
}
const ut=document.getElementById('ut'); let zj=null;
function untertitel(t){
  const r=aktiveRede(t);
  if(!r){ut.innerHTML='';zj=null;return;}
  if(zj!==r){zj=r;ut.innerHTML=r.t.split(' ').map(w=>`<span>${w}</span>`).join('');}
  const W=[...ut.querySelectorAll('span')],L=W.map(s=>s.textContent.length+2),S=L.reduce((a,b)=>a+b,0);let acc=0;
  const f=(t-r.a)/(r.d*0.9);
  W.forEach((s,i)=>{const a0=acc/S,a1=(acc+L[i])/S;acc+=L[i];const j=f>=a0&&f<a1,v=f>=a1;
    s.style.color=j?FARBE[r.w]:'#fff';s.style.opacity=(j||v)?'1':'0.42';
    const k=j?eSpr(cl((f-a0)/(a1-a0)*2.4)):1;s.style.transform=`scale(${j?(1+0.10*k).toFixed(3):1})`;});
  const e=eOut(pr(t,r.a,r.a+0.16));ut.style.transform=`translateY(${((1-e)*18).toFixed(1)}px)`;ut.style.opacity=String(e);
}
function zahlText(n,t){
  /* Spielautomat */
  if(n.spin){ if(t>=n.spin.von&&t<n.spin.bis){ let s=(Math.floor(t*18)*2654435761)%1000; return [String(10+Math.abs(s)%989),0,true]; }
    if(t>=n.spin.bis){ const g=t-n.spin.bis; return [n.spin.ende, g<0.36?1-g/0.36:0, false]; } }
  let txt=n.t, alt=n.t, g=0;
  for(const [wz,neu] of (n.wechsel||[])){ if(t>=wz){ alt=txt; txt=neu; const d=t-wz; g = d<0.36 ? 1-d/0.36 : 0; if(g>0 && Math.floor(d*28)%2===0) return [alt,g,false]; } }
  return [txt,g,false];
}
const ZEICHNER={}; let geladen=0;
IDS.forEach(id=>{const b=new Image();
  b.onload=()=>{ZEICHNER[id]=baueWarp2(document.querySelector('#'+id+' canvas'),b,D.szenen[id].fig||{}); if(++geladen===IDS.length) start();};
  b.src=window.SZENEN[id];});
function start(){
  const blur=document.getElementById('wischblur');
  window.render=function(t){
    let i=0; D.shots.forEach((s,n)=>{if(t>=s.a)i=n;});
    const sh=D.shots[i], ende=sh.cam==='ENDE', kam=ende?D.shots[i-1]:sh;
    IDS.forEach(id=>document.getElementById(id).style.display=(id===kam.sz)?'block':'none');
    const sz=kam.sz, S=D.szenen[sz], el=document.querySelector('#'+sz+' .rahmen');
    const lt=t-kam.a, d=(ende?sh.b:kam.b)-kam.a, f=eIO(cl(lt/d));
    let z=kam.z0+(kam.z1-kam.z0)*f;
    const ls=t-sh.a; if(i>0&&!ende) z*=1+0.075*(1-eOut(cl(ls/0.26)));
    let ox=0,oy=0,bx=0;
    if(M.drop!==undefined){const vd=t-M.drop;
      if(vd>-0.17&&vd<0){const k=eIO(cl((vd+0.17)/0.17));ox=-260*k;bx=40*k;}
      if(vd>=0&&vd<0.20){const k=1-eOut(cl(vd/0.20));ox=260*k;bx=40*k;}}
    for(const kk of KICKS){const dd=t-kk;if(dd>=0&&dd<0.16){const a=7*Math.exp(-dd*24);ox+=Math.sin(dd*120)*a;oy+=Math.cos(dd*97)*a*.7;}}
    el.style.transform=kamera3(kam.cx,kam.cy,z,S.w,S.h)+` translate(${ox.toFixed(2)}px,${oy.toFixed(2)}px)`;
    blur.setAttribute('stdDeviation',`${bx.toFixed(1)} 0`);
    let grade=' saturate(1.10)';
    if(S.grade==='kalt') grade=' saturate(.86) brightness(.94) hue-rotate(-6deg)';
    if(S.grade==='neutral') grade=' saturate(1.0)';
    if(S.grade==='dunkel'){const fl=0.88+0.08*Math.sin(t*23)*Math.sin(t*7.1)+0.06*Math.sin(t*3.3);grade=` brightness(${fl.toFixed(3)}) saturate(.92)`;}
    el.style.filter=(bx>0.3?'url(#wisch) ':'')+'contrast(1.07)'+grade;
    const blitz=i>0?(1-pr(ls,0,0.09))*0.36:0;
    q('#vig').style.background=`radial-gradient(118% 84% at 50% 44%,rgba(255,240,220,${blitz.toFixed(3)}) 0%,transparent 46%,rgba(0,0,0,${S.grade==='dunkel'?.78:.60}) 100%)`;
    const zu=zustand(t,sz); ZEICHNER[sz](zu);
    const r=aktiveRede(t);
    document.querySelectorAll('#'+sz+' .z').forEach(zel=>{
      const n=S.zahlen[+zel.dataset.i];
      const [vx,vy]=versatz2(n.x,n.y,zu,S.fig||{});
      const [txt,g,dreht]=zahlText(n,t); zel.textContent=txt;
      let s=1,hell=1,sch='';
      if(r&&r.w===n.wer&&(S.fig||{})[n.wer]){const a=env(r,t);s=1+.07*a;hell=1.05+.45*a;}
      if(n.cls==='flare'&&M.drop!==undefined){const dd=t-M.drop;if(dd>=0&&dd<0.9){const a=Math.exp(-dd*4);hell+=1.6*a;s+=.18*a;}}
      if(dreht){hell+=0.5; s+=0.04*Math.sin(t*40);}
      if(g>0){const v=(n.fs/10)*g; sch=`${v}px 0 0 rgba(255,0,60,.85), ${-v}px 0 0 rgba(0,230,255,.85), `;hell+=1.2*g;s+=.12*g;}
      zel.style.transform=`translate(-50%,-50%) translate(${vx.toFixed(2)}px,${vy.toFixed(2)}px) scale(${s.toFixed(3)})`;
      zel.style.filter=`brightness(${hell.toFixed(3)})`;
      zel.style.textShadow=sch?sch+'0 0 14px #fff,0 0 40px #FF9F43':'';
    });
    /* Titel oben */
    const ti=q('#titel'); let tt=null; for(const x of D.titel) if(t>=x.von&&t<x.bis) tt=x;
    if(tt){ if(ti.textContent!==tt.t) ti.textContent=tt.t; ti.style.top = tt.pos==='unten' ? '1290px' : '190px';
      const e=eOut(pr(t,tt.von,tt.von+0.28))*(1-pr(t,tt.bis-0.15,tt.bis));
      ti.style.opacity=String(e); ti.style.transform=`translateY(${((1-eOut(pr(t,tt.von,tt.von+0.28)))*-16).toFixed(1)}px)`; }
    else ti.style.opacity='0';
    staubMal(t); untertitel(t);
    if(M.ende!==undefined){const e=q('#ende'),k=pr(t,M.ende,M.ende+0.12); e.style.opacity=String(k);
      if(k>0){const sp=eSpr(pr(t,M.ende,M.ende+0.8)),pu=1+0.025*Math.max(0,Math.sin((t-M.ende)/BEAT*Math.PI));
        q('.gr',e).style.transform=`scale(${((0.78+0.22*sp)*pu).toFixed(3)})`;ut.style.opacity='0';ti.style.opacity='0';}}
  };
  window.render(0); window.bereit=true;
}
</script></body></html>
