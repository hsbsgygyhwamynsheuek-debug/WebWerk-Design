<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Vom Strich zur Seite</title>
<link rel="stylesheet" href="kern.css">
<style>
#s2{background:var(--sand)}
#s2 .buehne{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#s2 .rahmen{width:calc(1040px * var(--k));border-radius:calc(20px * var(--k));overflow:hidden;
  box-shadow:0 60px 120px -60px rgba(26,26,27,.5);background:#fff}
#stage.port #s2 .rahmen{width:calc(880px * var(--k))}
#s2 .kopf{height:calc(56px * var(--k));border-bottom:1px solid var(--linie);display:flex;
  align-items:center;gap:calc(10px * var(--k));padding:0 calc(24px * var(--k));background:#F6F4F0}
#s2 .kopf i{width:calc(12px * var(--k));height:calc(12px * var(--k));border-radius:99px;background:#D5D1C9}
#s2 .inhalt{padding:calc(46px * var(--k));display:flex;flex-direction:column;gap:calc(20px * var(--k))}
#s2 .box{border:calc(2px * var(--k)) dashed #B9B4AB;border-radius:calc(10px * var(--k));
  background:transparent;transition:none}
#s2 .b1{height:calc(220px * var(--k))}
#s2 .b2{height:calc(40px * var(--k));width:70%}
#s2 .b3{height:calc(40px * var(--k));width:48%}
#s2 .karten{display:flex;gap:calc(20px * var(--k))}
#s2 .karten .box{flex:1;height:calc(130px * var(--k))}
#s2 .scan{position:absolute;inset:0;pointer-events:none;opacity:.22;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.14) 0 1px,transparent 1px 4px)}
#s2 .balken{position:absolute;left:0;right:0;height:calc(3px * var(--k));
  background:linear-gradient(90deg,transparent,var(--akzent),transparent);opacity:0}
</style></head><body>
<div id="stage" class="land">
  <div class="scene" id="s1"><div class="pad">
    <p class="lab">So entsteht sie</p>
    <h1 class="h-l" style="margin-top:calc(26px * var(--k))"><span class="ln"><i>Erst Striche.</i></span><span class="ln"><i>Dann Ihre Seite.</i></span></h1>
  </div><div class="korn"></div></div>
  <div class="scene" id="s2">
    <div class="buehne"><div class="rahmen">
      <div class="kopf"><i></i><i></i><i></i></div>
      <div class="inhalt">
        <div class="box b1"></div><div class="box b2"></div><div class="box b3"></div>
        <div class="karten"><div class="box"></div><div class="box"></div><div class="box"></div></div>
      </div>
    </div></div>
    <div class="balken"></div><div class="scan"></div><div class="korn"></div>
  </div>
  <div class="scene" id="s3"><div class="pad">
    <h2 class="h-m"><span class="ln"><i>Entwurf am Dienstag.</i></span><span class="ln"><i>Online am Freitag.</i></span></h2>
    <p class="lead" style="margin-top:calc(30px * var(--k))">Sie sehen alles vorher. Veröffentlicht wird erst, wenn Sie ja sagen.</p>
  </div><div class="korn"></div></div>
</div>
<script src="kern.js"></script>
<script>
stage.insertAdjacentHTML('beforeend', ABSPANN_HTML);
const SZ=[{id:'s1',a:0,b:3.0},{id:'s2',a:3.0,b:14.6},{id:'s3',a:14.6,b:18.6},{id:'abspann',a:18.6,b:23.6}];
starteFilm(SZ,(id,lt)=>{
  if(id==='s1'){ steig(q('#s1 .lab'),lt,0.1,0.8,20); zeilen(q('#s1 h1'),lt,0.28,0.12,1.0); }
  if(id==='s2'){
    const k=K(), r=q('#s2 .rahmen'), e=eOut(pr(lt,0.1,1.0));
    put(r,{o:cl(e*1.5),y:(1-e)*34*k});
    /* Laufbalken wandert von oben nach unten und "füllt" dabei die Kästen */
    const lauf=pr(lt,1.6,7.6), bal=q('#s2 .balken');
    bal.style.opacity = (lt>1.5&&lt<7.9)?'0.9':'0';
    bal.style.top=(10+lauf*(stage.clientHeight-20))+'px';
    /* Jeder Kasten füllt sich, wenn der Balken ihn passiert hat.
       Feste Zeiten statt gemerkter Zustände – so ist jedes Einzelbild
       für sich berechenbar und sieht beim Rendern immer gleich aus. */
    const START=[2.1,3.9,4.6,5.4,5.8,6.2];
    qa('#s2 .box').forEach((b,i)=>{
      const f=eOut(pr(lt,START[i],START[i]+0.5));
      b.style.borderStyle = f>0.02?'solid':'dashed';
      b.style.borderColor = f>0.02?`rgba(226,223,217,${f})`:'#B9B4AB';
      b.style.background = b.classList.contains('b1')
        ? `rgba(26,26,27,${f})`
        : (b.parentElement.classList.contains('karten')
            ? `rgba(243,241,236,${f})` : `rgba(26,26,27,${f*0.86})`);
    });
    /* ein einziger kurzer Bildfehler – sichtbar "generiert", nicht blinkend */
    const g=pr(lt,7.7,8.05)*(1-pr(lt,8.05,8.4));
    q('#s2 .buehne').style.transform = g>0.02?`translateX(${(Math.sin(lt*90)*8*g*k).toFixed(2)}px)`:'';
    q('#s2 .scan').style.opacity = String(0.22 + g*0.5);
  }
  if(id==='s3'){ zeilen(q('#s3 h2'),lt,0.14,0.12,1.0); steig(q('#s3 .lead'),lt,0.7,1.0,26); }
  if(id==='abspann') malAbspann(lt);
},{abspann:0.3,s3:0.25});
</script></body></html>
