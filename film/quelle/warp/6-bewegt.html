const FIG = ['K','P','A'];
const RUHE = { K:{t:3.9,p:0.0,amp:3.2}, P:{t:3.2,p:1.7,amp:2.6}, A:{t:3.6,p:3.1,amp:2.4} };
/* Blinzelzeiten: fest vorberechnet, damit jedes Einzelbild gleich bleibt */
const BLINZEL = {};
FIG.forEach((k,n)=>{
  const l=[]; let z = 1.4 + n*1.1, s = 99 + n*7;
  while (z < KONF.dauer) {
    l.push(z);
    s = (s*1103515245 + 12345) % 2147483648;
    z += 2.6 + (s/2147483648)*4.2;
  }
  BLINZEL[k] = l;
});
function blinzelWert(k, t){
  let m = 0;
  for (const z of BLINZEL[k]) {
    const d = t - z;
    if (d >= 0 && d < 0.17) m = Math.max(m, Math.sin(Math.PI * d/0.17));
  }
  return m;
}
function zustand(t){
  /* laufende Sprachzeile finden */
  let r = null;
  for (const x of KONF.reden) if (t >= x.a && t < x.a + x.d) { r = x; break; }
  const z = {};
  FIG.forEach(k=>{
    const q = RUHE[k];
    const w = 2*Math.PI/q.t, ph = q.p;
    let dy = Math.sin(w*t + ph) * q.amp;
    let dx = Math.sin(w*0.63*t + ph*1.7) * q.amp * 1.5;
    let rot = Math.sin(w*0.47*t + ph*0.8) * 0.011;
    let sc = Math.sin(w*t + ph) * 0.0045;
    let mund = 0;
    if (r && r.w === k) {
      const lt = t - r.a;
      const n = Math.min(r.env.length-1, Math.max(0, Math.floor(lt*25)));
      const amp = r.env[n];
      mund = amp;
      /* beim Sprechen nickt der Kopf leicht mit */
      dy  -= amp * (k==='K' ? 7.5 : 5.0);
      rot += amp * (k==='P' ? 0.016 : k==='A' ? -0.016 : 0.008);
      sc  += amp * 0.004;
    }
    z[k] = {dx, dy, rot, sc, mund, blinzel: blinzelWert(k, t)};
  });
  return z;
}
